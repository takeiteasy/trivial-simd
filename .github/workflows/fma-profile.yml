name: FMA profile

on:
  workflow_dispatch:

concurrency:
  group: fma-profile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile:
    name: ${{ matrix.lisp }} / x86-64
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lisp: [sbcl-bin, ccl-bin, ecl]
    env:
      LISP: ${{ matrix.lisp }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_FMA_PROFILE=ON
      - name: Build
        run: cmake --build build --config Release
      - name: Native checks
        run: ctest --test-dir build -C Release --output-on-failure
      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: trivial-simd
          cache: false
      - name: Lisp checks
        shell: lispsh -eo pipefail {0}
        run: ros -Q run --eval '(handler-case (load "tests/run.lisp") (error (condition) (format *error-output* "~A~%" condition) (uiop:quit 1)))'
      - name: Native measurements
        run: |
          lscpu
          for trial in 1 2; do
            build/native_fma_software_profile
            build/native_fma_profile
          done
      - name: Lisp measurements
        shell: lispsh -eo pipefail {0}
        run: ros -Q run --load tests/run-fma-profile.lisp

  blas:
    name: BLAS tiles and thresholds / x86-64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y sbcl libopenblas-dev
      - name: Machine
        run: lscpu
      - name: Tile sweep
        run: |
          configs=(
            "default:"
            "tile-3x4:TS_BLAS_AVX_F64_ROWS=3;TS_BLAS_AVX_F64_COLUMNS=4;TS_BLAS_AVX_F32_ROWS=3;TS_BLAS_AVX_F32_COLUMNS=4"
            "tile-2x4:TS_BLAS_AVX_F64_ROWS=2;TS_BLAS_AVX_F64_COLUMNS=4;TS_BLAS_AVX_F32_ROWS=2;TS_BLAS_AVX_F32_COLUMNS=4"
            "tile-1x8:TS_BLAS_AVX_F64_ROWS=1;TS_BLAS_AVX_F64_COLUMNS=8;TS_BLAS_AVX_F32_ROWS=1;TS_BLAS_AVX_F32_COLUMNS=8"
            "depth-128:TS_BLAS_DEPTH=128"
            "depth-384:TS_BLAS_DEPTH=384"
            "depth-512:TS_BLAS_DEPTH=512"
            "rows-64:TS_BLAS_ROW_BLOCK=64"
            "rows-192:TS_BLAS_ROW_BLOCK=192"
            "rows-256:TS_BLAS_ROW_BLOCK=256"
            "columns-512:TS_BLAS_COLUMN_BLOCK=512"
            "columns-2048:TS_BLAS_COLUMN_BLOCK=2048"
          )
          for entry in "${configs[@]}"; do
            name="${entry%%:*}"
            echo "::group::$name"
            cmake -S . -B "build-$name" -DCMAKE_BUILD_TYPE=Release -DBUILD_BLAS_PROFILE=ON \
                  "-DBLAS_PROFILE_DEFINITIONS=${entry#*:}"
            cmake --build "build-$name" --target native_blas_profile
            for trial in 1 2; do "build-$name/native_blas_profile"; done
            echo "::endgroup::"
          done
      - name: Native and Lisp kernels
        run: |
          curl -fsSL --retry 5 -o quicklisp.lisp https://beta.quicklisp.org/quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp \
               --eval '(quicklisp-quickstart:install)' \
               --eval '(ql:quickload (list :cffi :fiveam :trivial-garbage :bordeaux-threads))'
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          export BLAS_BENCH_SIZES="8 16 24 32 48 64 128 256"
          echo "::group::native, always dispatched"
          BLAS_BENCH_THRESHOLD=1 sbcl --script tests/blas-bench.lisp
          echo "::endgroup::"
          echo "::group::lisp"
          TRIVIAL_SIMD_BACKEND=lisp sbcl --script tests/blas-bench.lisp
          echo "::endgroup::"
