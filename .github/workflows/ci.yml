name: CI

on:
  push:
    branches: [trunk]
    tags: ['v*']
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      os:
        description: Run only this OS family
        type: choice
        options: [all, linux, windows]
        default: all
      lisp:
        description: Run only Lisps whose name contains this text (for example ecl); empty for all
        type: string
        default: ''

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      extras: ${{ steps.plan.outputs.extras }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          ACTION: ${{ github.event.action }}
          LABEL: ${{ github.event.label.name }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          INPUT_OS: ${{ inputs.os }}
          INPUT_LISP: ${{ inputs.lisp }}
        run: .github/scripts/plan.sh

  test:
    needs: plan
    if: needs.plan.outputs.count != '0'
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      LISP: ${{ matrix.lisp }}
      TRIVIAL_SIMD_BACKEND: ${{ matrix.backend }}
    steps:
      - uses: actions/checkout@v4

      - name: Check ARM64 runner architecture
        if: matrix.os == 'ubuntu-24.04-arm'
        run: test "$RUNNER_ARCH" = ARM64

      - name: Build native library
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Compile native library
        run: cmake --build build --config Release

      - name: Test native kernel VM
        run: ctest --test-dir build -C Release --output-on-failure

      - uses: 40ants/setup-lisp@v4
        with:
          asdf-system: trivial-simd
          cache: false

      - name: Reserve a 4 GiB SBCL heap
        if: contains(matrix.lisp, 'sbcl')
        shell: lispsh -eo pipefail {0}
        run: ros config set dynamic-space-size 4GB

      - name: Run tests
        shell: lispsh -eo pipefail {0}
        run: ros -Q run --eval '(handler-case (load "tests/run.lisp") (error (condition) (format *error-output* "~A~%" condition) (uiop:quit 1)))'

  arm-windows:
    needs: plan
    if: contains(fromJSON(needs.plan.outputs.extras), 'arm-windows')
    name: SBCL / Windows ARM64
    runs-on: windows-11-arm
    env:
      TRIVIAL_SIMD_BACKEND: native
    steps:
      - uses: actions/checkout@v4

      - name: Check runner architecture
        shell: pwsh
        run: |
          if ($env:RUNNER_ARCH -ne 'ARM64') { throw "Expected ARM64 runner, got $env:RUNNER_ARCH" }

      - name: Build native library
        run: cmake -S . -B build -A ARM64 -DCMAKE_BUILD_TYPE=Release

      - name: Compile native library
        run: cmake --build build --config Release

      - name: Test native kernel VM
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Install SBCL ARM64
        shell: pwsh
        run: |
          $msi = Join-Path $env:RUNNER_TEMP 'sbcl-arm64.msi'
          Invoke-WebRequest 'https://github.com/roswell/sbcl_bin/releases/download/2.6.8/sbcl-2.6.8-arm64-windows-binary.msi' -OutFile $msi
          $actual = (Get-FileHash $msi -Algorithm SHA256).Hash
          if ($actual -ne '8c6a0752b911c2142f42f024a295a14ce044c6687cd6c4ede808eaa13438aa80') { throw 'SBCL download checksum mismatch' }
          $install = Start-Process msiexec.exe -ArgumentList @('/i', $msi, '/qn', '/norestart') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "SBCL installer exited $($install.ExitCode)" }
          $sbcl = Get-ChildItem $env:ProgramFiles -Filter sbcl.exe -Recurse | Select-Object -First 1 -ExpandProperty FullName
          if (-not $sbcl) { throw 'SBCL executable was not installed' }
          "SBCL_EXE=$sbcl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Lisp dependencies
        shell: pwsh
        run: |
          & $env:SBCL_EXE --noinform --non-interactive --eval '(unless (member :arm64 *features*) (error "Expected ARM64 SBCL"))'
          if ($LASTEXITCODE -ne 0) { throw 'SBCL architecture check failed' }
          $bootstrap = Join-Path $env:RUNNER_TEMP 'quicklisp.lisp'
          Invoke-WebRequest 'https://beta.quicklisp.org/quicklisp.lisp' -OutFile $bootstrap
          & $env:SBCL_EXE --noinform --non-interactive --load $bootstrap --eval '(quicklisp-quickstart:install)'
          if ($LASTEXITCODE -ne 0) { throw 'Quicklisp installation failed' }
          & $env:SBCL_EXE --noinform --non-interactive --load "$HOME/quicklisp/setup.lisp" --eval '(ql:quickload (list :cffi :fiveam :trivial-garbage :bordeaux-threads))'
          if ($LASTEXITCODE -ne 0) { throw 'Lisp dependency installation failed' }

      - name: Run tests
        shell: pwsh
        run: |
          if (-not (Test-Path build/trivial_simd.dll)) { throw 'Native DLL is missing' }
          & $env:SBCL_EXE --dynamic-space-size 4096 --script tests/run.lisp
          if ($LASTEXITCODE -ne 0) { throw "Tests exited $LASTEXITCODE" }
